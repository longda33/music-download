name: music-download

on:
  repository_dispatch:
    types: [music-download]
  workflow_dispatch:
    inputs:
      payload:
        description: JSON payload from n8n
        required: true
        type: string

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      ALIST_URL: ${{ secrets.ALIST_URL }}
      ALIST_TOKEN: ${{ secrets.ALIST_TOKEN }}
      ALIST_PATH: ${{ secrets.ALIST_PATH }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade requests tqdm opencc-python-reimplemented mutagen

      - name: Run music downloader
        env:
          EVENT_PAYLOAD: ${{ github.event.client_payload && toJSON(github.event.client_payload) || inputs.payload }}
        run: python music_download_action.py
